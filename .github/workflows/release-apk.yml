name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          fi
          [[ "$tag" != -* ]]
          git check-ref-format "refs/tags/$tag"
          prerelease=false
          if [[ "$tag" == *-* ]]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "apk_name=scrollit-${tag}-debug.apk"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Build APK and run checks
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release asset
        shell: bash
        env:
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          cat <<'EOF' > dist/release-notes.md
          ScrollIt AutoScroll update.

          - Touch remains the default and works without Shizuku
          - AutoScroll injects a continuous touch stream through Shizuku
          - Verified with Ultimate Guitar Tabs 7.3.22
          - 30 slow speed levels work in both modes
          - Clear red status when the selected backend is unavailable
          - Shizuku setup guide in the README
          - Debug-signed APK for manual installation
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="ScrollIt ${tag}"
          asset="dist/$APK_NAME"
          notes="dist/release-notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            exit 0
          fi
          args=("$tag" "$asset" --title "$title" --notes-file "$notes")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
